[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus-gitops"
description = "GitOps platform CLI: production-grade Kubernetes for any app, from one nexus.yaml."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Kalyan" }]
keywords = ["kubernetes", "gitops", "argocd", "cli", "devops"]
dynamic = ["version"]
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "jinja2>=3.1",
    "kubernetes>=29.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-PyYAML",
    "httpx2",  # only needed for FastAPI's TestClient in tests/unit/test_dashboard_backend.py
]
dashboard = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
nexus = "nexus_cli.main:app"

[tool.hatch.version]
path = "nexus_cli/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["nexus_cli"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["legacy", "venv", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
files = ["nexus_cli", "dashboard/backend"]
disallow_untyped_defs = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "kubernetes.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
# Deliberately unit-only by default: tests/integration/ needs a real cluster
# and can take minutes, unlike the ~1s unit suite. Run it explicitly with
# `pytest tests/integration`.
testpaths = ["tests/unit"]
markers = [
    "chaos: needs Chaos Mesh on the cluster (tests/integration only); run explicitly with -m chaos",
]
