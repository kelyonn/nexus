[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus-gitops"
description = "GitOps platform CLI: production-grade Kubernetes for any app, from one nexus.yaml."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Kalyan" }]
keywords = ["kubernetes", "gitops", "argocd", "cli", "devops"]
dynamic = ["version"]
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "jinja2>=3.1",
    "kubernetes>=29.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-PyYAML",
    "httpx2",  # only needed for FastAPI's TestClient in tests/unit/test_dashboard_backend.py
]
dashboard = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]
docs = [
    "mkdocs-material>=9",
]

[project.scripts]
nexus = "nexus_cli.main:app"

[tool.hatch.version]
path = "nexus_cli/__init__.py"

# Hatchling's default sdist (no include/exclude given) is "every git-tracked
# file" — which would ship legacy/ (32 files, explicitly read-only reference
# material, not package content), tests/, docs_site/, and .github/ inside a
# source distribution meant to build the nexus-gitops package. Scoped
# explicitly instead: everything a wheel build actually needs, whether
# building directly from this checkout or from an extracted sdist —
# including dashboard/frontend's *source* (not dashboard/frontend/out/,
# which is gitignored and produced by hatch_build.py, not shipped as source).
[tool.hatch.build.targets.sdist]
include = [
    "/nexus_cli",
    "/dashboard/__init__.py",
    "/dashboard/backend",
    "/dashboard/frontend/app",
    "/dashboard/frontend/lib",
    "/dashboard/frontend/package.json",
    "/dashboard/frontend/package-lock.json",
    "/dashboard/frontend/next.config.ts",
    "/dashboard/frontend/next-env.d.ts",
    "/dashboard/frontend/tsconfig.json",
    "/dashboard/frontend/eslint.config.mjs",
    "/hatch_build.py",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

# Builds dashboard/frontend's static export before packaging (see
# hatch_build.py) — scoped to the wheel target only, not sdist: an sdist
# should stay source-only and buildable without Node, the wheel is the
# consumable artifact that needs dashboard/frontend/out/ already baked in.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["nexus_cli"]

# `dashboard` isn't in `packages` above (that dir also holds the ~large,
# Node-only `frontend/` source tree, node_modules included, which has no
# business in a Python wheel) — force-include picks out exactly the two
# things that do: the backend package itself, and the frontend's *built*
# static export (dashboard/frontend/out/, produced by the hook above).
[tool.hatch.build.targets.wheel.force-include]
"dashboard/__init__.py" = "dashboard/__init__.py"
"dashboard/backend" = "dashboard/backend"
"dashboard/frontend/out" = "dashboard/frontend/out"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["legacy", "venv", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
files = ["nexus_cli", "dashboard/backend"]
disallow_untyped_defs = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "kubernetes.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
# Deliberately unit-only by default: tests/integration/ needs a real cluster
# and can take minutes, unlike the ~1s unit suite. Run it explicitly with
# `pytest tests/integration`.
testpaths = ["tests/unit"]
markers = [
    "chaos: needs Chaos Mesh on the cluster (tests/integration only); run explicitly with -m chaos",
]
