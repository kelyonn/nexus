name: Release

# Triggered by pushing a `v*` tag (e.g. `v0.1.0`) — `git tag v0.1.0 && git push
# origin v0.1.0`. Tagging and pushing are human-initiated (see CLAUDE.md); this
# workflow only runs once that's actually done.
#
# Uses PyPI Trusted Publishing (OIDC) — no API token/secret stored in this
# repo. One-time setup required on pypi.org before the *first* publish: the
# `nexus-gitops` project must have a trusted publisher configured pointing at
# this repo + workflow file + the `pypi` environment below. See
# https://docs.pypi.org/trusted-publishers/adding-a-publisher/

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Safety net: a bad tag pushed outside the normal CI-gated PR flow
      # must not still make it onto PyPI.
      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: ruff
        run: ruff check .

      - name: mypy
        run: mypy nexus_cli

      - name: unit tests
        run: pytest -q

      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
