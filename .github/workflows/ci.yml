name: CI

on:
  # Scoped to main (not every branch): a commit pushed to an open PR branch
  # already triggers the full suite via pull_request below, so an
  # unscoped push trigger ran this workflow — two Kind clusters, four npm
  # builds — twice for the same commit. push: main covers post-merge
  # commits (a direct push, or an admin merge without a PR).
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-unit:
    name: lint + unit (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install nexus + dev + dashboard dependencies
        run: pip install -e ".[dev,dashboard]"

      # scripts/gate.sh is the single source of truth for ruff/mypy/pytest
      # scope and the coverage floor — release.yml runs the exact same
      # script, so the two can't quietly diverge on what "passing" means.
      - name: Quality gate (ruff, mypy, pytest + coverage)
        run: ./scripts/gate.sh

  dashboard-frontend:
    name: dashboard frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies (for type generation below)
        working-directory: .
        run: pip install -e ".[dashboard]"

      # scripts/generate_dashboard_types.py's whole point (PRD-adjacent: no
      # spec section for it, but the same "CLI and dashboard can't silently
      # disagree" principle everything else in dashboard/backend follows) —
      # regenerate and fail if that changes anything, so a Pydantic model
      # edited without regenerating types is caught here, not by a user
      # hitting a runtime type mismatch.
      - name: Generated dashboard types are up to date
        working-directory: .
        run: |
          python3 scripts/generate_dashboard_types.py
          git diff --exit-code dashboard/frontend/lib/api.generated.ts || {
            echo "::error::dashboard/frontend/lib/api.generated.ts is stale — run 'python3 scripts/generate_dashboard_types.py' and commit the result."
            exit 1
          }

      - name: ESLint
        run: npx eslint .

      - name: TypeScript
        run: npx tsc --noEmit

      # Compiles the production bundle. NEXUS_STATIC_EXPORT=1 matches what
      # actually ships (see next.config.ts) — building without it would only
      # prove the dev-mode config compiles, not the one `nexus dashboard`
      # and the packaged wheel depend on.
      - name: Build (static export)
        run: npm run build
        env:
          NEXUS_STATIC_EXPORT: "1"

  wheel-build:
    name: wheel packaging (dashboard frontend bundled, no Node at install time)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/frontend/package-lock.json

      # Node is needed here (hatch_build.py shells out to npm) but not by
      # whoever later installs this wheel — that's the whole point of this
      # job: catch a packaging regression before it ships an empty dashboard.
      - name: Build wheel
        run: pip install build && python -m build --wheel

      - name: Frontend static export and templates landed in the wheel
        run: |
          python -c "
          import zipfile, glob, sys
          path = glob.glob('dist/*.whl')[0]
          names = zipfile.ZipFile(path).namelist()
          # dashboard/frontend/out/index.html: if this build silently degrades
          # (see hatch_build.py), nexus dashboard breaks for anyone who pip
          # installs the wheel. nexus_cli/templates/deployment.yaml.j2: if
          # templates ever fall out of packages/force-include, every nexus
          # deploy from this wheel breaks the same way, silently.
          required = ['dashboard/frontend/out/index.html', 'nexus_cli/templates/deployment.yaml.j2']
          for r in required:
              assert r in names, f'{r} missing from {path}'
          assert not any('node_modules' in n for n in names), 'node_modules leaked into the wheel'
          print(f'OK: {required} all present, node_modules absent, {len(names)} files total')
          "

  integration:
    name: Kind e2e (deploy/status/destroy, idempotency, preflight failures, partial-failure)
    runs-on: ubuntu-latest
    needs: lint-and-unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install nexus + dev dependencies
        run: pip install -e ".[dev]"

      - name: Set up helm
        uses: azure/setup-helm@v4

      # kubectl ships preinstalled on GitHub-hosted ubuntu runners.
      - name: Create Kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: nexus-ci

      - name: Integration tests
        run: pytest tests/integration -m "not chaos" -v

  integration-chaos:
    name: Kind e2e (chaos — allowed to fail)
    runs-on: ubuntu-latest
    needs: lint-and-unit
    # The specific webhook-not-ready race this used to guard against
    # (docs/IMPLEMENTATION-PLAN.md's finding) is now handled at the command
    # level — core/chaos.py's with_webhook_retry() retries on that exact
    # error text, unit-tested against it directly (retry-then-succeed,
    # give-up-after-deadline, don't-retry-other-errors). continue-on-error
    # stays regardless: Chaos Mesh's own Helm install + CRD/webhook
    # registration settling on Kind's shared CI runners is a lower-level,
    # infra-timing concern that retry can't reach, and it should never block
    # the merge-critical jobs above. A weekly, non-muted run
    # (chaos-canary.yml) exists specifically so a persistent regression here
    # doesn't stay silently invisible just because PRs never see it fail.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install nexus + dev dependencies
        run: pip install -e ".[dev]"

      - name: Set up helm
        uses: azure/setup-helm@v4

      - name: Create Kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: nexus-ci-chaos

      - name: Chaos integration test
        run: pytest tests/integration/test_chaos.py -m chaos -v
